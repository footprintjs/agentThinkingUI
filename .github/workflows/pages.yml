name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancelling in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build the library bundle (dist/)
        run: |
          npm ci
          npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages automatically if it isn't already.
          enablement: true

      - name: Upload site artifact
        # The demo loads the prebuilt library from ../dist (built above); we publish
        # the whole repository and let the root index.html redirect to demo/index.html.
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
