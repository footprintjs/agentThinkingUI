name: Publish to npm

# Publishes the package when you cut a GitHub Release (or run it manually).
# One-time setup: add an npm automation token as the repo secret NPM_TOKEN
# (npmjs.com → Access Tokens → Generate → "Automation").
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      # No build step — this library ships as-is (plain scripts + types).
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
