name: Publish to npm

# Publishes the package when you cut a GitHub Release (or run it manually).
# Auth: OIDC "trusted publishing" — NO token, no repo secret. One-time setup on
# npmjs.com: package `agentthinkingui` → Settings → Trusted Publisher →
# GitHub Actions → repo `footprintjs/agentThinkingUI`, workflow `npm-publish.yml`.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # OIDC token for trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      # Install devDeps (esbuild) — `prepublishOnly` builds via build.mjs on publish.
      - run: npm ci
      - run: npm test
      # Trusted publishing requires npm >= 11.5.1 (newer than node 20's bundled npm).
      - run: npm install -g npm@latest
      # No NODE_AUTH_TOKEN: npm authenticates via the GitHub OIDC token above,
      # verified against the package's trusted-publisher config on npmjs.
      - run: npm publish --provenance --access public
