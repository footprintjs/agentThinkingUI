name: Publish to npm

# Publishes the package when you cut a GitHub Release (or run it manually).
# Auth: OIDC "trusted publishing" — NO token, no repo secret. One-time setup on
# npmjs.com: package `agentthinkingui` → Settings → Trusted Publisher →
# GitHub Actions → repo `footprintjs/agentThinkingUI`, workflow `npm-publish.yml`.
on:
  release:
    types: [published]

# Least privilege: NO id-token at the top level. OIDC publish power is granted ONLY to the
# `publish` job, which consumes a PRE-PACKED tarball and does ZERO dependency resolution —
# so the unpinned install never shares a runtime with the registry token or provenance.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No committed lockfile (library policy). This job has NO publish power.
      - run: npm install
      # Build EXPLICITLY here: the publish job consumes a pre-packed tarball, so the
      # `prepublishOnly` build hook will NOT fire there — it must happen at pack time.
      - run: npm run build
      - run: npm test
      # Packaging-correctness gate — block a publish that would ship broken types.
      - run: npm run check:package
      - name: Pack the publishable tarball
        run: |
          npm pack
          mv ./*.tgz package.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: package.tgz
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing — granted to THIS job only
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package-tarball
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      # Pinned to the 11.x line: npm 12.0.0 went `latest` on 2026-07-08 with a broken
      # provenance path (MODULE_NOT_FOUND: sigstore) that fails `npm publish --provenance`.
      - run: npm install -g npm@11
      # Publish the pre-packed tarball directly — no node_modules, no dep resolution, and
      # prepublishOnly does NOT re-run (the build already happened at pack time above).
      # No NODE_AUTH_TOKEN: npm authenticates via the GitHub OIDC token.
      - run: npm publish ./package.tgz --provenance --access public
