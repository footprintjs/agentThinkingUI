<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentThinkingUI — component explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesque:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../src/styles.css" />
  <style>
    /* explorer chrome (NOT the library) — a Storybook-style controls + preview + props layout */
    body { margin: 0; font-family: var(--font-body); color: var(--ink); background: #F4EBDB; }
    .ex-head { display: flex; align-items: center; gap: 14px; padding: 14px 22px; border-bottom: 1px solid #E6D8C2; background: #FFFDF8; }
    .ex-head h1 { font-family: var(--font-display); font-size: 18px; margin: 0; font-weight: 700; }
    .ex-head h1 b { color: #C0531F; }
    .ex-tabs { display: flex; gap: 4px; margin-left: 8px; }
    .ex-tabs button { font: inherit; font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: 9px; border: 1px solid #E6D8C2; background: #fff; cursor: pointer; }
    .ex-tabs button.on { background: #C0531F; color: #fff; border-color: #C0531F; }
    .ex-grid { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 58px); }
    .ex-controls { border-right: 1px solid #E6D8C2; background: #FFFDF8; padding: 16px 18px; overflow-y: auto; }
    .ex-main { padding: 22px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
    .ex-preview { height: 560px; border: 1px solid #E6D8C2; border-radius: 16px; overflow: hidden; background: #fff; }
    .ex-lbl { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #A2917C; margin: 14px 0 6px; }
    .ex-controls label { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 6px 0; }
    .ex-controls input[type=text] { width: 100%; font: inherit; font-size: 13px; padding: 6px 9px; border: 1px solid #E6D8C2; border-radius: 8px; box-sizing: border-box; }
    .ex-chip { font: inherit; font-size: 12.5px; padding: 5px 11px; border: 1px solid #E6D8C2; border-radius: 8px; background: #fff; cursor: pointer; }
    .ex-chip.on { background: #F6E4D6; border-color: #C0531F; }
    .ex-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .ex-code { font-family: ui-monospace, monospace; font-size: 12px; background: #2C1F15; color: #F3E7D4; padding: 12px 14px; border-radius: 12px; white-space: pre-wrap; overflow-x: auto; }
    .ex-code .p { color: #E9A35C; } .ex-code .s { color: #93C7A6; }
    table.ex-props { width: 100%; border-collapse: collapse; font-size: 13px; background: #FFFDF8; border: 1px solid #E6D8C2; border-radius: 12px; overflow: hidden; }
    table.ex-props th, table.ex-props td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #EFE5D4; vertical-align: top; }
    table.ex-props th { background: #F4EBDB; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #6E5C49; }
    table.ex-props code { font-family: ui-monospace, monospace; font-size: 12px; color: #95380F; }
    .ex-sw { width: 24px; height: 24px; border-radius: 7px; border: 2px solid #fff; box-shadow: 0 0 0 1px #E6D8C2; cursor: pointer; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <!-- the library, prebuilt (sets window.AgentThinkingUI / MultiAgentFlow). Run `npm run build`. -->
  <script src="../dist/agentthinkingui.umd.js"></script>

  <script type="text/babel">
    const { useState } = React;
    const cost = (ms, t) => ({ ms, tokens: t });
    // a compact trace covering every step kind
    const TRACE = { task: "Plan a 3-day offsite under $5,000", title: "Offsite", agent: "Planner", model: "claude", asker: "you", steps: [
      { kind: "prompt", brain: "Reading the ask — budget, dates, team size.", cost: cost(900, 120) },
      { kind: "ask", tool: "search_flights", toolName: "search_flights", input: { to: "LIS" }, brain: "I need fares first.", cost: cost(400, 60) },
      { kind: "return", tool: "search_flights", toolName: "search_flights", replyType: "data", output: { price: 286 }, brainMode: "reason", brain: "€286 return — within budget.", cost: cost(700, 220) },
      { kind: "ask", tool: "load_skill", toolName: "load_skill", input: { name: "budget_policy" }, brain: "Check the spend policy.", cost: cost(300, 40) },
      { kind: "return", tool: "load_skill", toolName: "load_skill", replyType: "instruction", skill: "budget_policy", actChecklist: [{ text: "Cap hotel at $180/night" }, { text: "Prefer refundable" }], brainMode: "act", brain: "Following the budget policy.", cost: cost(500, 90) },
      { kind: "answer", to: "you", brain: "Here's the plan.", answer: { headline: "Lisbon, 3 nights — $4,720", plan: ["Flights €286pp", "Hotel Baixa"], budget: [["Flights", "$1,144"], ["Hotel", "$1,620"]], cta: "Book it" }, cost: cost(800, 260) },
    ] };
    const mini = (name) => ({ task: name, agent: name, model: "loop", asker: "orchestrator", steps: [
      { kind: "prompt", brain: name + " — got the task.", cost: cost(220, 130) },
      { kind: "answer", to: "orchestrator", brain: "Done.", answer: { headline: name + " result", plan: [], budget: [], cta: "" }, cost: cost(240, 160) } ] });
    const GRAPH = { task: "planner → workers → synthesis", nodes: [
      { id: "p", kind: "agent", name: "Planner", role: "orchestrator", trace: mini("Planner") },
      { id: "w1", kind: "agent", name: "Flights", role: "worker", trace: mini("Flights") },
      { id: "w2", kind: "agent", name: "Hotels", role: "worker", trace: mini("Hotels") },
      { id: "s", kind: "merge", label: "synthesis" } ],
      edges: [{ from: "p", to: "w1", kind: "seq" }, { from: "p", to: "w2", kind: "seq" }, { from: "w1", to: "s", kind: "seq" }, { from: "w2", to: "s", kind: "seq" }] };
    // demo source ids (the adapters set these from real spans) so the deep-link + onSelect read out
    TRACE.steps.forEach((s, i) => { s.spanId = "span-" + i; });
    GRAPH.nodes.forEach((n) => { if (n.kind === "agent") n.spanId = "agent-" + n.id; });

    // prop reference (mirrors docs/API.md) rendered as a live table
    const PROPS = {
      single: [
        ["trace", "Trace", "—", "the recorded run (required)"],
        ["theme", "ThemeConfig", "built-in", "scoped colors/fonts/radii/shadows + light|dark mode"],
        ["labels", "{ agent, toolbox }", "built-in", "display names"],
        ["icons", "{ brain, toolbox }", "drawn", "emoji / image / drawn glyphs"],
        ["brand", "ReactNode", "none", "optional wordmark in the top bar"],
        ["metaphor", "boolean", "true", "show the storytelling tags"],
        ["loop", "boolean", "false", "auto-loop playback"],
        ["live", "boolean", "false", "tail the newest step as the trace grows"],
        ["mobile", "boolean", "false", "stacked mobile layout"],
        ["storageKey", "string | null", "derived", "persist scrub position (null disables)"],
        ["onRender", "(m) => void", "—", "opt-in UI render metrics (React Profiler)"],
        ["onSelect", "(step, i) => void", "—", "fires per beat; step carries spanId/traceId"],
        ["linkResolver", "(step) => url", "—", "renders an 'open ↗' deep-link for the step"],
      ],
      multi: [
        ["trace", "FlowGraph", "—", "the team as a control-flow graph (required)"],
        ["theme / labels / icons / brand", "—", "—", "as AgentThinkingUI; carried into drill-down"],
        ["live", "boolean", "false", "tail the team timeline as the graph grows"],
        ["onSelect", "(beat) => void", "—", "fires per team beat (carries _agent, spanId)"],
        ["onNodeOpen", "(node) => void", "—", "fires when an agent is drilled into"],
        ["linkResolver", "(node) => url", "—", "renders an '↗' deep-link on the agent card"],
        ["onRender", "(m) => void", "—", "UI render metrics (adds agents)"],
      ],
    };

    const BRANDS = ["#C0531F", "#2563EB", "#1F8A5B", "#7A5AE0"];

    function Toggle({ label, v, set }) {
      return <label><input type="checkbox" checked={v} onChange={(e) => set(e.target.checked)} />{label}</label>;
    }
    // a sample host widget for renderDetail — the raw content OTel didn't capture,
    // that the company keeps elsewhere and fetches by spanId
    function RawPanel({ step }) {
      const raw = JSON.stringify({ spanId: step.spanId, kind: step.kind, source: "your store (joined by spanId)", note: "content the OTel/OpenInference span didn't carry" }, null, 2);
      return (
        <div>
          <div className="ex-lbl" style={{ margin: "0 0 6px" }}>raw span · your store</div>
          <pre style={{ fontFamily: "ui-monospace, monospace", fontSize: 11, background: "#2C1F15", color: "#F3E7D4", padding: "10px 12px", borderRadius: 10, whiteSpace: "pre-wrap", margin: 0 }}>{raw}</pre>
        </div>
      );
    }

    function Explorer() {
      const [comp, setComp] = useState("single");
      const [mode, setMode] = useState("light");
      const [brand, setBrand] = useState("Demo");
      const [color, setColor] = useState(null);
      const [metaphor, setMetaphor] = useState(true);
      const [loop, setLoop] = useState(false);
      const [mobile, setMobile] = useState(false);
      const [live, setLive] = useState(false);
      const [scale, setScale] = useState(1);
      const [brain, setBrain] = useState("default");
      const [deeplink, setDeeplink] = useState(true);
      const [detail, setDetail] = useState(true);
      const [lastEvent, setLastEvent] = useState("");

      const theme = { mode, ...(color ? { colors: { brand: color } } : {}), ...(scale !== 1 ? { fonts: { scale } } : {}) };
      const icons = brain === "default" ? {} : { brain: { kind: "emoji", value: brain } };
      const brandNode = brand ? <span>Agent<b>ThinkingUI</b></span> : null;

      const hooks = (deeplink ? "\n  linkResolver={(x) => obsURL(x)}" : "") + (detail ? "\n  renderDetail={(s) => <RawLog spanId={s.spanId} />}" : "");
      const code = comp === "single"
        ? `<AgentThinkingUI\n  trace={trace}\n  theme={{ mode: "${mode}"${color ? `, colors: { brand: "${color}" }` : ""}${scale !== 1 ? `, fonts: { scale: ${scale} }` : ""} }}\n  ${brain !== "default" ? `icons={{ brain: { kind: "emoji", value: "${brain}" } }}\n  ` : ""}metaphor={${metaphor}} loop={${loop}} live={${live}} mobile={${mobile}}${hooks}\n/>`
        : `<MultiAgentFlow\n  trace={graph}\n  theme={{ mode: "${mode}"${color ? `, colors: { brand: "${color}" }` : ""} }}${hooks}\n/>`;

      const chip = (on) => "ex-chip" + (on ? " on" : "");
      return (
        <>
          <div className="ex-head">
            <h1>Agent<b>ThinkingUI</b> · explorer</h1>
            <div className="ex-tabs">
              <button className={comp === "single" ? "on" : ""} onClick={() => setComp("single")}>&lt;AgentThinkingUI&gt;</button>
              <button className={comp === "multi" ? "on" : ""} onClick={() => setComp("multi")}>&lt;MultiAgentFlow&gt;</button>
            </div>
            <span style={{ flex: 1 }} />
            <a href="./index.html" style={{ fontSize: 13, color: "#6E5C49", textDecoration: "none" }}>full demo ↗</a>
          </div>
          <div className="ex-grid">
            <div className="ex-controls">
              <div className="ex-lbl">Mode</div>
              <div className="ex-row">
                <button className={chip(mode === "light")} onClick={() => setMode("light")}>☀ Light</button>
                <button className={chip(mode === "dark")} onClick={() => setMode("dark")}>☾ Dark</button>
              </div>
              <div className="ex-lbl">Brand colour</div>
              <div className="ex-row">{BRANDS.map((c) => <span key={c} className="ex-sw" style={{ background: c, boxShadow: color === c ? "0 0 0 2px #C0531F" : "0 0 0 1px #E6D8C2" }} onClick={() => setColor(c)} />)}</div>
              <div className="ex-lbl">Brand wordmark</div>
              <input type="text" value={brand} onChange={(e) => setBrand(e.target.value)} placeholder="(none)" />
              {comp === "single" && <>
                <div className="ex-lbl">Brain icon</div>
                <div className="ex-row">
                  <button className={chip(brain === "default")} onClick={() => setBrain("default")}>drawn</button>
                  <button className={chip(brain === "🧠")} onClick={() => setBrain("🧠")}>🧠</button>
                  <button className={chip(brain === "🤖")} onClick={() => setBrain("🤖")}>🤖</button>
                </div>
                <div className="ex-lbl">Text scale</div>
                <div className="ex-row">{[0.9, 1, 1.1].map((s) => <button key={s} className={chip(scale === s)} onClick={() => setScale(s)}>{s}×</button>)}</div>
                <div className="ex-lbl">Behaviour</div>
                <Toggle label="metaphor" v={metaphor} set={setMetaphor} />
                <Toggle label="loop" v={loop} set={setLoop} />
                <Toggle label="live" v={live} set={setLive} />
                <Toggle label="mobile" v={mobile} set={setMobile} />
              </>}
              <div className="ex-lbl">Host hooks</div>
              <Toggle label="linkResolver → open ↗" v={deeplink} set={setDeeplink} />
              <Toggle label="renderDetail → raw panel" v={detail} set={setDetail} />
              <div style={{ fontSize: 11.5, color: "#A2917C", marginTop: 4 }}>onSelect / onNodeOpen fire on interaction (see below).</div>
            </div>
            <div className="ex-main">
              <div className="ex-preview">
                {comp === "single"
                  ? <AgentThinkingUI key={mode + scale + brain + mobile} trace={TRACE} theme={theme} icons={icons} brand={brandNode} metaphor={metaphor} loop={loop} live={live} mobile={mobile}
                      onSelect={(s, i) => setLastEvent("onSelect → #" + (i + 1) + " " + s.kind + (s.spanId ? " (" + s.spanId + ")" : ""))}
                      linkResolver={deeplink ? (s) => "https://your-obs-tool.example/span/" + s.spanId : undefined}
                      renderDetail={detail ? (s) => <RawPanel step={s} /> : undefined} />
                  : <MultiAgentFlow key={mode} trace={GRAPH} theme={theme} brand={brandNode}
                      onSelect={(s) => setLastEvent("onSelect → " + s._name + " · " + s.kind)}
                      onNodeOpen={(n) => setLastEvent("onNodeOpen → " + n.name + " (" + (n.spanId || n.id) + ")")}
                      linkResolver={deeplink ? (n) => "https://your-obs-tool.example/agent/" + (n.spanId || n.id) : undefined}
                      renderDetail={detail ? (s) => <RawPanel step={s} /> : undefined} />}
              </div>
              <div style={{ fontSize: 12.5, color: "#6E5C49" }}><b style={{ color: "#95380F" }}>event</b> &nbsp;{lastEvent || "— scrub or click an agent to fire onSelect / onNodeOpen —"}</div>
              <pre className="ex-code">{code}</pre>
              <table className="ex-props">
                <thead><tr><th>prop</th><th>type</th><th>default</th><th>description</th></tr></thead>
                <tbody>{PROPS[comp].map((r) => <tr key={r[0]}><td><code>{r[0]}</code></td><td><code>{r[1]}</code></td><td><code>{r[2]}</code></td><td>{r[3]}</td></tr>)}</tbody>
              </table>
            </div>
          </div>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Explorer />);
  </script>
</body>
</html>
