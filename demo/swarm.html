<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentThinkingUI — multi-agent (swarm)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesque:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../src/styles.css" />
</head>
<body>
  <div class="grain"></div>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- the library, prebuilt (sets window.AgentSwarm, …). Run `npm run build`. -->
  <script src="../dist/agentthinkingui.umd.js"></script>
  <script src="flow-trace.js"></script>
  <script type="text/babel">
    // The six named multi-agent patterns, each a control-flow graph.
    // Pick one; click an agent node to drill into its single-agent flow.
    function FlowDemo() {
      const { useState, useEffect, useRef } = React;
      const flows = window.AGENT_FLOWS;
      const keys = Object.keys(flows);
      const [k, setK] = useState(keys[0]);
      const [reveal, setReveal] = useState(0); // 0 = show whole graph; >0 = live stream up to N nodes
      const timer = useRef(null);
      const full = flows[k].graph;
      const live = reveal > 0;
      const graph = live ? { ...full, nodes: full.nodes.slice(0, reveal) } : full;

      const stopLive = () => { if (timer.current) clearInterval(timer.current); timer.current = null; };
      const startLive = () => {
        stopLive(); setReveal(1); let n = 1;
        timer.current = setInterval(() => { n += 1; setReveal(n); if (n >= full.nodes.length) stopLive(); }, 1100);
      };
      const pick = (key) => { stopLive(); setReveal(0); setK(key); };
      useEffect(() => stopLive, []);

      const tab = (on) => ({ border: "1px solid " + (on ? "#C0531F" : "#E6D8C2"), background: on ? "#F6E4D6" : "#fff",
        borderRadius: 999, padding: "5px 12px", font: "inherit", fontSize: 12.5, fontWeight: 700, color: "#2C1F15", cursor: "pointer" });
      return (
        <>
          <div style={{ position: "fixed", top: 14, left: "50%", transform: "translateX(-50%)", zIndex: 60,
            display: "flex", gap: 6, flexWrap: "wrap", justifyContent: "center", maxWidth: "92%",
            background: "rgba(255,253,248,.92)", border: "1px solid #E6D8C2", borderRadius: 16, padding: 7, boxShadow: "0 2px 12px rgba(70,45,25,.12)" }}>
            {keys.map((key) => <button key={key} style={tab(k === key)} onClick={() => pick(key)}>{flows[key].label}</button>)}
            <button style={{ ...tab(live), display: "flex", alignItems: "center", gap: 6 }} onClick={startLive}>
              <span style={{ width: 8, height: 8, borderRadius: "50%", background: live ? "#C0531F" : "#A2917C" }} />{live ? "Streaming…" : "● Live"}
            </button>
          </div>
          <a href="./index.html" style={{ position: "fixed", top: 16, left: 18, zIndex: 60, fontSize: 12.5, fontWeight: 700, color: "#6E5C49", textDecoration: "none" }}>‹ Single-agent</a>
          <AgentSwarm key={k} trace={graph} live={live} brand={<>Agent<b>ThinkingUI</b></>} />
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<FlowDemo />);
  </script>
</body>
</html>
